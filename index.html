<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aventura Estelar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1a2e;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #1a1a2e;
    image-rendering: auto;
    max-width: 100%;
    max-height: 100%;
  }
  /* ---- Controles táctiles ---- */
  #touch {
    position: fixed;
    inset: 0;
    display: none;
    pointer-events: none;
    z-index: 5;
  }
  .tbtn {
    position: absolute;
    bottom: 4vh;
    width: 17vmin; height: 17vmin;
    min-width: 58px; min-height: 58px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.35);
    color: rgba(255,255,255,0.85);
    font-size: 7vmin;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
  }
  .tbtn:active { background: rgba(255,255,255,0.3); }
  #btnL { left: 4vw; }
  #btnR { left: calc(4vw + 19vmin + 10px); }
  #btnJ { right: 4vw; }
  /* ---- Pantalla sorpresa ---- */
  #surprise {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: radial-gradient(ellipse at center, #4a154b 0%, #2d0a3d 55%, #16031f 100%);
    z-index: 20;
    text-align: center;
    padding: 24px;
    opacity: 0;
    transition: opacity 2s ease;
  }
  #surprise.show { opacity: 1; }
  #heartsCanvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #sIntro {
    color: #ffd1e8;
    font-size: clamp(18px, 4vw, 30px);
    letter-spacing: 1px;
    min-height: 1.5em;
    z-index: 2;
  }
  #sMsg {
    color: #fff;
    font-size: clamp(34px, 8vw, 84px);
    font-weight: 800;
    margin-top: 26px;
    line-height: 1.2;
    z-index: 2;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 1.4s ease, transform 1.4s cubic-bezier(.18,1.4,.4,1);
    text-shadow: 0 0 30px #ff5fa2, 0 0 70px #ff2d78;
    background: linear-gradient(180deg, #fff 30%, #ffc2dd 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #sMsg.show { opacity: 1; transform: scale(1); }
  #sHeart {
    font-size: clamp(50px, 12vw, 120px);
    margin-top: 18px;
    z-index: 2;
    opacity: 0;
    transition: opacity 1.2s ease 0.6s;
    animation: beat 1.1s ease-in-out infinite;
  }
  #sHeart.show { opacity: 1; }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.18); }
    40% { transform: scale(1); }
    55% { transform: scale(1.12); }
  }
  #sSub {
    color: rgba(255, 209, 232, 0.85);
    font-size: clamp(14px, 3vw, 22px);
    margin-top: 30px;
    z-index: 2;
    opacity: 0;
    transition: opacity 1.5s ease 1.4s;
    font-style: italic;
  }
  #sSub.show { opacity: 1; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="560"></canvas></div>

<div id="touch">
  <div class="tbtn" id="btnL">◀</div>
  <div class="tbtn" id="btnR">▶</div>
  <div class="tbtn" id="btnJ">⬆</div>
</div>

<div id="surprise">
  <canvas id="heartsCanvas"></canvas>
  <div id="sIntro"></div>
  <div id="sMsg">Te amo mucho<br>Catalincita</div>
  <div id="sHeart">❤️</div>
  <div id="sSub">Ganaste el juego... y mi corazón es tuyo para siempre.</div>
</div>

<script>
'use strict';

// ============================================================
//  AVENTURA ESTELAR — juego de plataformas
// ============================================================
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = cvs.width, H = cvs.height;
const TILE = 40;

// Ajustar tamaño visible manteniendo proporción
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cvs.style.width = (W * s) + 'px';
  cvs.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

// ------------------------------------------------------------
// Niveles (cada string es una fila; cada char un tile de 40px)
//   # suelo/bloque   = plataforma flotante   * estrella
//   ^ pinchos        e enemigo               P inicio
//   F bandera meta
// ------------------------------------------------------------
const LEVELS = [
{
  name: 'Nivel 1 · El Bosque Brillante',
  sky: ['#2b5876', '#4e4376'],
  map: [
'                                                            ',
'                                                            ',
'                                                            ',
'              *                                             ',
'            =====        *  *                               ',
'                       ======          *                    ',
'   *                              ========                  ',
'  ===       *                                 *        F    ',
'           ===     e                  *      ===      ===   ',
'    P                          *    =====                   ',
'  =====        ===========   ===                    e       ',
'                                                            ',
'######    ##############################   ################',
'######    ##############################   ################',
  ]
},
{
  name: 'Nivel 2 · Las Cavernas de Cristal',
  sky: ['#0f2027', '#2c5364'],
  map: [
'                                                                      ',
'                                                                      ',
'        *                  *                                          ',
'      =====              =====        *   *                           ',
'                 *                  =======                           ',
'   P           =====                            =====                 ',
'  ====                    e                *            *             ',
'           =======    =========           ===   e     ====     F      ',
'    *                                                          ===    ',
'   ===          *                  =====     ========                 ',
'              =====    *                                  *           ',
'                      ====   ^^                         ====    e     ',
'#########   ###############################   #######################',
'#########   ###############################   #######################',
  ]
},
{
  name: 'Nivel 3 · El Castillo de las Estrellas',
  sky: ['#41295a', '#2F0743'],
  map: [
'                                                                                ',
'                                                  *                             ',
'            *                *                  =====                           ',
'          =====            =====                          *   *                 ',
'                    *               e                   =======                 ',
'   P              =====        ==========                            *      F   ',
'  ====    e                                     *                  =====   ==== ',
'        ======            *                    ===          e                   ',
'                 *      =====                          ==========               ',
'    *           ===                =====    *                            *      ',
'  =====                  e                 ===       *            ^^   =====    ',
'                     =========                      ====   ^^^                  ',
'########   ####################   #########################################    ',
'########   ####################   #########################################    ',
  ]
}
];

// ------------------------------------------------------------
// Estado
// ------------------------------------------------------------
let levelIdx = 0;
let level = null;          // datos del nivel cargado
let player = null;
let camX = 0;
let stars = [], enemies = [], particles = [];
let totalStars = 0, gotStars = 0;
let state = 'title';       // title | play | levelclear | won
let stateTimer = 0;
let time = 0;

function loadLevel(i) {
  const L = LEVELS[i];
  level = {
    name: L.name,
    sky: L.sky,
    rows: L.map.length,
    cols: L.map[0].length,
    solid: [],
    spikes: [],
    flag: null,
  };
  stars = []; enemies = []; particles = [];
  for (let r = 0; r < level.rows; r++) {
    level.solid[r] = [];
    level.spikes[r] = [];
    for (let c = 0; c < level.cols; c++) {
      const ch = L.map[r][c] || ' ';
      level.solid[r][c] = (ch === '#' || ch === '=');
      level.spikes[r][c] = (ch === '^');
      if (ch === 'P') {
        player = makePlayer(c * TILE + 8, r * TILE);
        level.spawn = { x: c * TILE + 8, y: r * TILE };
      }
      if (ch === '*') stars.push({ x: c * TILE + TILE / 2, y: r * TILE + TILE / 2, got: false, ph: Math.random() * 6 });
      if (ch === 'e') enemies.push(makeEnemy(c * TILE, r * TILE + 10));
      if (ch === 'F') level.flag = { x: c * TILE + TILE / 2, y: r * TILE };
    }
  }
  totalStars = stars.length;
  gotStars = 0;
  camX = 0;
}

function makePlayer(x, y) {
  return { x, y, w: 24, h: 34, vx: 0, vy: 0, onGround: false, face: 1, anim: 0, inv: 0 };
}
function makeEnemy(x, y) {
  return { x, y, w: 30, h: 26, dir: 1, speed: 1.1, ph: Math.random() * 6 };
}

// ------------------------------------------------------------
// Entrada
// ------------------------------------------------------------
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (state === 'title' && (e.code === 'Space' || e.code === 'Enter')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Táctil
const touchUI = document.getElementById('touch');
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const tkeys = { L: false, R: false, J: false };
function bindBtn(id, k) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); tkeys[k] = true; if (state === 'title') startGame(); };
  const off = e => { e.preventDefault(); tkeys[k] = false; };
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });
}
bindBtn('btnL', 'L'); bindBtn('btnR', 'R'); bindBtn('btnJ', 'J');
if (isTouch) touchUI.style.display = 'block';
cvs.addEventListener('touchstart', e => { if (state === 'title') startGame(); }, { passive: true });

function inputLeft()  { return keys['ArrowLeft'] || keys['KeyA'] || tkeys.L; }
function inputRight() { return keys['ArrowRight'] || keys['KeyD'] || tkeys.R; }
function inputJump()  { return keys['ArrowUp'] || keys['KeyW'] || keys['Space'] || tkeys.J; }

function startGame() {
  state = 'play';
  levelIdx = 0;
  loadLevel(0);
}

// ------------------------------------------------------------
// Física y colisiones
// ------------------------------------------------------------
const GRAV = 0.55, MOVE = 0.6, MAXVX = 4.4, JUMP = -12.2, FRIC = 0.82;

function solidAt(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if (r < 0 || c < 0 || c >= level.cols) return false;
  if (r >= level.rows) return false;
  return level.solid[r][c];
}
function spikeAt(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if (r < 0 || r >= level.rows || c < 0 || c >= level.cols) return false;
  return level.spikes[r][c];
}

let jumpHeld = false;

function updatePlayer() {
  const p = player;
  // Horizontal
  if (inputLeft())  { p.vx -= MOVE; p.face = -1; }
  if (inputRight()) { p.vx += MOVE; p.face = 1; }
  if (!inputLeft() && !inputRight()) p.vx *= FRIC;
  p.vx = Math.max(-MAXVX, Math.min(MAXVX, p.vx));

  // Salto (con corte al soltar para control fino)
  if (inputJump()) {
    if (p.onGround && !jumpHeld) {
      p.vy = JUMP;
      p.onGround = false;
      spawnDust(p.x + p.w / 2, p.y + p.h, 6);
    }
    jumpHeld = true;
  } else {
    if (p.vy < -4) p.vy = -4; // salto corto
    jumpHeld = false;
  }

  p.vy += GRAV;
  if (p.vy > 14) p.vy = 14;

  // Mover X
  p.x += p.vx;
  if (p.vx > 0) {
    if (solidAt(p.x + p.w, p.y + 2) || solidAt(p.x + p.w, p.y + p.h - 2)) {
      p.x = Math.floor((p.x + p.w) / TILE) * TILE - p.w - 0.01;
      p.vx = 0;
    }
  } else if (p.vx < 0) {
    if (solidAt(p.x, p.y + 2) || solidAt(p.x, p.y + p.h - 2)) {
      p.x = (Math.floor(p.x / TILE) + 1) * TILE + 0.01;
      p.vx = 0;
    }
  }
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  const maxX = level.cols * TILE - p.w;
  if (p.x > maxX) { p.x = maxX; p.vx = 0; }

  // Mover Y
  p.y += p.vy;
  p.onGround = false;
  if (p.vy > 0) {
    if (solidAt(p.x + 3, p.y + p.h) || solidAt(p.x + p.w - 3, p.y + p.h)) {
      p.y = Math.floor((p.y + p.h) / TILE) * TILE - p.h - 0.01;
      p.vy = 0;
      p.onGround = true;
    }
  } else if (p.vy < 0) {
    if (solidAt(p.x + 3, p.y) || solidAt(p.x + p.w - 3, p.y)) {
      p.y = (Math.floor(p.y / TILE) + 1) * TILE + 0.01;
      p.vy = 0;
    }
  }

  // Peligros
  if (p.inv > 0) p.inv--;
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  if (spikeAt(cx, p.y + p.h - 4) || p.y > level.rows * TILE + 100) {
    die();
    return;
  }

  // Enemigos
  for (const e of enemies) {
    if (rectHit(p.x, p.y, p.w, p.h, e.x + 3, e.y + 3, e.w - 6, e.h - 6)) {
      if (p.vy > 1 && p.y + p.h - e.y < 18) {
        // aplastado
        e.dead = true;
        p.vy = -8;
        spawnBurst(e.x + e.w / 2, e.y + e.h / 2, '#9be15d', 12);
      } else if (p.inv === 0) {
        die();
        return;
      }
    }
  }
  enemies = enemies.filter(e => !e.dead);

  // Estrellas
  for (const s of stars) {
    if (!s.got && Math.abs(cx - s.x) < 26 && Math.abs(cy - s.y) < 28) {
      s.got = true;
      gotStars++;
      spawnBurst(s.x, s.y, '#ffd86b', 10);
    }
  }

  // Meta
  if (level.flag) {
    const f = level.flag;
    if (Math.abs(cx - f.x) < 28 && cy > f.y - TILE * 2 && cy < f.y + TILE * 2.2) {
      reachFlag();
      return;
    }
  }

  p.anim += Math.abs(p.vx) * 0.06;

  // Cámara
  const target = p.x + p.w / 2 - W / 2;
  camX += (target - camX) * 0.12;
  camX = Math.max(0, Math.min(camX, level.cols * TILE - W));
}

function die() {
  spawnBurst(player.x + player.w / 2, player.y + player.h / 2, '#ff6b8a', 16);
  player.x = level.spawn.x;
  player.y = level.spawn.y;
  player.vx = 0; player.vy = 0;
  player.inv = 60;
}

function reachFlag() {
  if (levelIdx < LEVELS.length - 1) {
    state = 'levelclear';
    stateTimer = 0;
  } else {
    state = 'won';
    stateTimer = 0;
    setTimeout(showSurprise, 1500);
  }
}

function updateEnemies() {
  for (const e of enemies) {
    e.x += e.dir * e.speed;
    const ahead = e.x + (e.dir > 0 ? e.w + 2 : -2);
    const wallHit = solidAt(ahead, e.y + e.h / 2);
    const floorAhead = solidAt(ahead, e.y + e.h + 6);
    if (wallHit || !floorAhead) e.dir *= -1;
  }
}

function rectHit(x1, y1, w1, h1, x2, y2, w2, h2) {
  return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
}

// ------------------------------------------------------------
// Partículas
// ------------------------------------------------------------
function spawnDust(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({ x, y, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 1.5, life: 20, c: 'rgba(255,255,255,0.5)', r: 2 + Math.random() * 2 });
  }
}
function spawnBurst(x, y, c, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: 30 + Math.random() * 15, c, r: 2 + Math.random() * 3 });
  }
}
function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--;
  }
  particles = particles.filter(p => p.life > 0);
}

// ------------------------------------------------------------
// Dibujo
// ------------------------------------------------------------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const sky = level ? level.sky : LEVELS[0].sky;
  g.addColorStop(0, sky[0]);
  g.addColorStop(1, sky[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // estrellitas de fondo
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 40; i++) {
    const sx = ((i * 137 + 50) % (W + 200)) - (camX * 0.2) % (W + 200);
    const x = ((sx % (W + 200)) + W + 200) % (W + 200) - 100;
    const y = (i * 89) % (H * 0.7);
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(time * 0.03 + i));
    ctx.globalAlpha = tw * 0.7;
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalAlpha = 1;
  // colinas lejanas
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  for (let i = -1; i < 6; i++) {
    const hx = i * 300 - (camX * 0.4) % 300;
    ctx.beginPath();
    ctx.arc(hx, H + 60, 200, Math.PI, 0);
    ctx.fill();
  }
}

function drawTiles() {
  const c0 = Math.max(0, Math.floor(camX / TILE));
  const c1 = Math.min(level.cols - 1, Math.ceil((camX + W) / TILE));
  for (let r = 0; r < level.rows; r++) {
    for (let c = c0; c <= c1; c++) {
      const x = c * TILE - camX, y = r * TILE;
      if (level.solid[r][c]) {
        const ground = r > 0 && !level.solid[r - 1][c];
        ctx.fillStyle = '#5d4a7e';
        ctx.fillRect(x, y, TILE, TILE);
        if (ground) {
          ctx.fillStyle = '#8ed16f';
          ctx.fillRect(x, y, TILE, 8);
          ctx.fillStyle = '#6fb653';
          ctx.fillRect(x, y + 8, TILE, 4);
        }
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.fillRect(x + 2, y + 14, 8, 8);
        ctx.fillRect(x + 22, y + 26, 10, 6);
      }
      if (level.spikes[r][c]) {
        ctx.fillStyle = '#d9e4f5';
        for (let k = 0; k < 4; k++) {
          ctx.beginPath();
          ctx.moveTo(x + k * 10, y + TILE);
          ctx.lineTo(x + k * 10 + 5, y + TILE - 16);
          ctx.lineTo(x + k * 10 + 10, y + TILE);
          ctx.fill();
        }
      }
    }
  }
}

function drawStars() {
  for (const s of stars) {
    if (s.got) continue;
    const y = s.y + Math.sin(time * 0.06 + s.ph) * 4;
    drawStarShape(s.x - camX, y, 11, '#ffd86b', '#ffaf3d');
  }
}
function drawStarShape(x, y, r, fill, stroke) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(time * 0.04) * 0.15);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 === 0 ? r : r * 0.45;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawEnemies() {
  for (const e of enemies) {
    const x = e.x - camX, y = e.y;
    const squish = 1 + Math.sin(time * 0.15 + e.ph) * 0.08;
    ctx.save();
    ctx.translate(x + e.w / 2, y + e.h);
    ctx.scale(1, squish);
    // cuerpo gelatinoso
    ctx.fillStyle = '#7ac74f';
    ctx.beginPath();
    ctx.moveTo(-e.w / 2, 0);
    ctx.quadraticCurveTo(-e.w / 2, -e.h * 1.15, 0, -e.h * 1.15);
    ctx.quadraticCurveTo(e.w / 2, -e.h * 1.15, e.w / 2, 0);
    ctx.closePath();
    ctx.fill();
    // ojos
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-6, -e.h * 0.65, 5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -e.h * 0.65, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-6 + e.dir * 2, -e.h * 0.65, 2.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(6 + e.dir * 2, -e.h * 0.65, 2.4, 0, 7); ctx.fill();
    ctx.restore();
  }
}

function drawFlag() {
  if (!level.flag) return;
  const f = level.flag;
  const x = f.x - camX, y = f.y;
  // asta
  ctx.fillStyle = '#e8e8e8';
  ctx.fillRect(x - 2, y - TILE * 1.6, 4, TILE * 2.55);
  // bandera ondeando
  const wave = Math.sin(time * 0.1) * 4;
  ctx.fillStyle = '#ff5fa2';
  ctx.beginPath();
  ctx.moveTo(x + 2, y - TILE * 1.6);
  ctx.quadraticCurveTo(x + 24, y - TILE * 1.6 + 8 + wave, x + 42, y - TILE * 1.6 + 2 + wave);
  ctx.lineTo(x + 42, y - TILE * 1.6 + 22 + wave);
  ctx.quadraticCurveTo(x + 24, y - TILE * 1.6 + 28 + wave, x + 2, y - TILE * 1.6 + 24);
  ctx.closePath();
  ctx.fill();
  drawStarShape(x + 22, y - TILE * 1.6 + 13 + wave * 0.6, 7, '#fff', '#ffd86b');
  ctx.beginPath();
  ctx.arc(x, y - TILE * 1.6, 5, 0, 7);
  ctx.fillStyle = '#ffd86b';
  ctx.fill();
}

function drawPlayer() {
  const p = player;
  if (p.inv > 0 && Math.floor(p.inv / 4) % 2 === 0) return; // parpadeo
  const x = p.x - camX, y = p.y;
  const bob = p.onGround ? Math.sin(p.anim) * 1.5 : 0;
  ctx.save();
  ctx.translate(x + p.w / 2, y + p.h / 2 + bob);
  ctx.scale(p.face, 1);
  // cuerpo
  ctx.fillStyle = '#ff8c42';
  roundRect(-12, -17, 24, 30, 8);
  ctx.fill();
  // panza
  ctx.fillStyle = '#ffd9b3';
  roundRect(-8, -2, 16, 13, 6);
  ctx.fill();
  // orejas de zorrito
  ctx.fillStyle = '#ff8c42';
  ctx.beginPath(); ctx.moveTo(-11, -15); ctx.lineTo(-7, -26); ctx.lineTo(-2, -16); ctx.fill();
  ctx.beginPath(); ctx.moveTo(2, -16); ctx.lineTo(7, -26); ctx.lineTo(11, -15); ctx.fill();
  // ojos
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(3, -8, 4.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(4.5, -8, 2.2, 0, 7); ctx.fill();
  // nariz
  ctx.fillStyle = '#5e3a1e';
  ctx.beginPath(); ctx.arc(11, -4, 2.5, 0, 7); ctx.fill();
  // cola
  ctx.fillStyle = '#ff8c42';
  ctx.beginPath();
  ctx.ellipse(-15, 6, 8, 5, Math.sin(time * 0.1) * 0.3 - 0.5, 0, 7);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-19, 8, 4, 3, -0.5, 0, 7);
  ctx.fill();
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x - camX, p.y, p.r, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRect(12, 12, 220, 36, 10);
  ctx.fill();
  drawStarShape(34, 30, 9, '#ffd86b', '#ffaf3d');
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px "Segoe UI", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(gotStars + ' / ' + totalStars, 52, 37);
  ctx.font = '14px "Segoe UI", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(level.name, 118, 35);
}

function drawTitle() {
  drawSky();
  ctx.textAlign = 'center';
  // título
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 58px "Segoe UI", sans-serif';
  ctx.shadowColor = '#ff5fa2';
  ctx.shadowBlur = 25;
  ctx.fillText('⭐ AVENTURA ESTELAR ⭐', W / 2, H / 2 - 60);
  ctx.shadowBlur = 0;
  ctx.font = '22px "Segoe UI", sans-serif';
  ctx.fillStyle = '#cdd9f5';
  ctx.fillText('Supera los 3 niveles y llega a la bandera final', W / 2, H / 2 - 10);
  ctx.font = '18px "Segoe UI", sans-serif';
  ctx.fillStyle = '#9fb3d9';
  if (isTouch) {
    ctx.fillText('Usa los botones ◀ ▶ para moverte y ⬆ para saltar', W / 2, H / 2 + 40);
    ctx.fillText('Salta sobre los enemigos para vencerlos', W / 2, H / 2 + 68);
  } else {
    ctx.fillText('Flechas o WASD para moverte · Espacio o ⬆ para saltar', W / 2, H / 2 + 40);
    ctx.fillText('Salta sobre los enemigos para vencerlos', W / 2, H / 2 + 68);
  }
  const blink = Math.sin(time * 0.08) > -0.3;
  if (blink) {
    ctx.font = 'bold 24px "Segoe UI", sans-serif';
    ctx.fillStyle = '#ffd86b';
    ctx.fillText(isTouch ? '— Toca para comenzar —' : '— Presiona ESPACIO para comenzar —', W / 2, H / 2 + 130);
  }
  // estrellita decorativa girando
  drawStarShape(W / 2, H / 2 + 185, 16, '#ffd86b', '#ffaf3d');
}

function drawLevelClear() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd86b';
  ctx.font = 'bold 46px "Segoe UI", sans-serif';
  ctx.fillText('¡Nivel completado!', W / 2, H / 2 - 20);
  ctx.fillStyle = '#fff';
  ctx.font = '22px "Segoe UI", sans-serif';
  ctx.fillText('Preparando el siguiente nivel...', W / 2, H / 2 + 25);
}

function drawWon() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd86b';
  ctx.font = 'bold 52px "Segoe UI", sans-serif';
  ctx.fillText('¡GANASTE! 🏆', W / 2, H / 2);
}

// ------------------------------------------------------------
// Bucle principal
// ------------------------------------------------------------
function loop() {
  time++;
  if (state === 'title') {
    drawTitle();
  } else if (state === 'play') {
    updatePlayer();
    updateEnemies();
    updateParticles();
    drawSky();
    drawTiles();
    drawFlag();
    drawStars();
    drawEnemies();
    drawPlayer();
    drawParticles();
    drawHUD();
  } else if (state === 'levelclear') {
    drawSky(); drawTiles(); drawFlag(); drawPlayer();
    drawLevelClear();
    stateTimer++;
    if (stateTimer > 110) {
      levelIdx++;
      loadLevel(levelIdx);
      state = 'play';
    }
  } else if (state === 'won') {
    drawSky(); drawTiles(); drawFlag(); drawPlayer();
    drawWon();
  }
  requestAnimationFrame(loop);
}
loop();

// ============================================================
//  LA SORPRESA 💕
// ============================================================
const surpriseEl = document.getElementById('surprise');
const heartsCvs = document.getElementById('heartsCanvas');
const hctx = heartsCvs.getContext('2d');

function showSurprise() {
  surpriseEl.style.display = 'flex';
  requestAnimationFrame(() => surpriseEl.classList.add('show'));
  touchUI.style.display = 'none';

  heartsCvs.width = window.innerWidth;
  heartsCvs.height = window.innerHeight;
  window.addEventListener('resize', () => {
    heartsCvs.width = window.innerWidth;
    heartsCvs.height = window.innerHeight;
  });

  startHearts();
  typeWriter('Espera... esto no era solo un juego... 💌', () => {
    setTimeout(() => {
      document.getElementById('sMsg').classList.add('show');
      document.getElementById('sHeart').classList.add('show');
      document.getElementById('sSub').classList.add('show');
      bigConfetti();
    }, 600);
  });
}

function typeWriter(text, done) {
  const el = document.getElementById('sIntro');
  let i = 0;
  const t = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) { clearInterval(t); done(); }
  }, 65);
}

// Corazones y confeti flotando
let floaters = [];
function startHearts() {
  setInterval(() => {
    if (floaters.length < 70) {
      floaters.push({
        x: Math.random() * heartsCvs.width,
        y: heartsCvs.height + 30,
        vy: -(0.8 + Math.random() * 1.8),
        vx: (Math.random() - 0.5) * 0.6,
        size: 12 + Math.random() * 26,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.04,
        type: 'heart',
        hue: Math.random() < 0.7 ? 340 : 320,
        alpha: 0.5 + Math.random() * 0.5,
      });
    }
  }, 180);
  heartsLoop();
}

function bigConfetti() {
  for (let i = 0; i < 120; i++) {
    floaters.push({
      x: heartsCvs.width / 2 + (Math.random() - 0.5) * 200,
      y: heartsCvs.height / 2,
      vy: -3 - Math.random() * 7,
      vx: (Math.random() - 0.5) * 10,
      size: 5 + Math.random() * 7,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.3,
      type: 'confetti',
      hue: Math.random() * 360,
      alpha: 1,
      grav: 0.12,
    });
  }
}

function heartsLoop() {
  hctx.clearRect(0, 0, heartsCvs.width, heartsCvs.height);
  for (const f of floaters) {
    f.x += f.vx; f.y += f.vy; f.rot += f.vr;
    if (f.grav) f.vy += f.grav;
    hctx.save();
    hctx.translate(f.x, f.y);
    hctx.rotate(f.type === 'heart' ? Math.sin(f.rot) * 0.3 : f.rot);
    hctx.globalAlpha = f.alpha;
    if (f.type === 'heart') {
      drawHeart(hctx, 0, 0, f.size, `hsl(${f.hue}, 90%, 65%)`);
    } else {
      hctx.fillStyle = `hsl(${f.hue}, 95%, 60%)`;
      hctx.fillRect(-f.size / 2, -f.size / 4, f.size, f.size / 2);
    }
    hctx.restore();
  }
  floaters = floaters.filter(f => f.y > -60 && f.y < heartsCvs.height + 80);
  requestAnimationFrame(heartsLoop);
}

function drawHeart(c, x, y, s, color) {
  c.fillStyle = color;
  c.beginPath();
  const k = s / 2;
  c.moveTo(x, y + k * 0.6);
  c.bezierCurveTo(x - k, y - k * 0.6, x - k * 2, y + k * 0.3, x, y + k * 1.6);
  c.bezierCurveTo(x + k * 2, y + k * 0.3, x + k, y - k * 0.6, x, y + k * 0.6);
  c.fill();
}
